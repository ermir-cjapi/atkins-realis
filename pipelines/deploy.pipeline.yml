trigger: none

resources:
  pipelines:
    - pipeline: build
      source: 'Agents - HR - Build'
      trigger:
        branches:
          - main
          - refs/tags/*

variables:
  isTagged: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/')]
  # ServiceNow tuning defaults match appsettings.json. Stage-scoped variable groups override them,
  # so an environment only needs these variables when it departs from the defaults.
  serviceNowSearchPath: '/api/atki2/ai_search'
  serviceNowTurnBudgetMilliseconds: '10000'
  serviceNowSearchAttemptTimeoutMilliseconds: '8000'
  serviceNowOAuthAttemptTimeoutMilliseconds: '3000'
  serviceNowSearchRetryCount: '1'
  serviceNowOAuthRetryCount: '1'
  serviceNowRetryBaseDelayMilliseconds: '100'
  serviceNowCircuitSamplingMilliseconds: '30000'
  serviceNowCircuitFailureRatio: '0.5'
  serviceNowCircuitMinimumThroughput: '10'
  serviceNowCircuitBreakMilliseconds: '30000'
  serviceNowRateLimitRequestsPerSecond: '5'
  serviceNowRateLimitBurst: '5'
  serviceNowRateLimitQueueLimit: '5'
  serviceNowCacheFreshMinutes: '15'
  serviceNowCacheMaximumStaleMinutes: '60'
  serviceNowCacheSizeLimit: '1000'
  serviceNowCacheVersion: 'v1'
  serviceNowMaxSearchTermCharacters: '100'
  serviceNowMaxResults: '12'
  serviceNowMaxLlmResults: '5'
  serviceNowMaxLlmResultContentCharacters: '2500'
  serviceNowMaxLlmPayloadCharacters: '10000'
  serviceNowMaxTitleCharacters: '500'
  serviceNowMaxTextCharacters: '8000'
  serviceNowMaxColumns: '20'
  serviceNowMaxColumnValueCharacters: '8000'

# Runtime application settings are supplied by the environment variable groups below. Keep the
# ServiceNow rate and cache values aligned with the approved environment-specific operating limits.

stages:
  - stage: DEV
    variables:
      - group: 'Agents-HR-DEV'
    jobs:
      - template: templates/deploy-env.pipeline.yml
        parameters:
          azureSubscription: 'ACE-ALZ-AzureDevOps-ServiceConnection-Sub-5972ebe9-8383-47ce-aaac-d9b3e892850c'
          environment: 'dev'
          devOpsEnvironment: 'Agents - HR - DEV'
          searchEndpoint: '$(sharePointSearchEndpoint)'
          searchIndexName: '$(sharePointSearchIndexName)'
          searchSkillsetName: '$(sharePointSearchSkillsetName)'
          searchDataSourceName: '$(sharePointSearchDataSourceName)'
          searchIndexerName: '$(sharePointSearchIndexerName)'
          sharePointSiteUrl: '$(sharePointSiteUrl)'
          tenantId: '$(entraTenantId)'
          searchIngestionApplicationId: '$(searchIngestionApplicationId)'
          searchFederatedCredentialApplicationId: '$(searchFederatedCredentialApplicationId)'
          searchEmbeddingEndpoint: '$(searchEmbeddingEndpoint)'
          searchAiServicesEndpoint: '$(searchAiServicesEndpoint)'
          sharePointLibraryUrl: '$(sharePointLibraryUrl)'
          apiAdditionalAppSettings:
            - '-Foundry__Endpoint "$(foundryEndpoint)"'
            - '-Foundry__DeploymentName "$(foundryDeploymentName)"'
            - '-ServiceNow__Enabled "$(serviceNowEnabled)"'
            - '-ServiceNow__Endpoint "$(serviceNowEndpoint)"'
            - '-ServiceNow__TokenEndpoint "$(serviceNowTokenEndpoint)"'
            - '-ServiceNow__ClientId "$(serviceNowClientId)"'
            - '-ServiceNow__SearchPath "$(serviceNowSearchPath)"'
            - '-ServiceNow__TurnBudgetMilliseconds "$(serviceNowTurnBudgetMilliseconds)"'
            - '-ServiceNow__SearchAttemptTimeoutMilliseconds "$(serviceNowSearchAttemptTimeoutMilliseconds)"'
            - '-ServiceNow__OAuthAttemptTimeoutMilliseconds "$(serviceNowOAuthAttemptTimeoutMilliseconds)"'
            - '-ServiceNow__SearchRetryCount "$(serviceNowSearchRetryCount)"'
            - '-ServiceNow__OAuthRetryCount "$(serviceNowOAuthRetryCount)"'
            - '-ServiceNow__RetryBaseDelayMilliseconds "$(serviceNowRetryBaseDelayMilliseconds)"'
            - '-ServiceNow__CircuitSamplingMilliseconds "$(serviceNowCircuitSamplingMilliseconds)"'
            - '-ServiceNow__CircuitFailureRatio "$(serviceNowCircuitFailureRatio)"'
            - '-ServiceNow__CircuitMinimumThroughput "$(serviceNowCircuitMinimumThroughput)"'
            - '-ServiceNow__CircuitBreakMilliseconds "$(serviceNowCircuitBreakMilliseconds)"'
            - '-ServiceNow__RateLimitRequestsPerSecond "$(serviceNowRateLimitRequestsPerSecond)"'
            - '-ServiceNow__RateLimitBurst "$(serviceNowRateLimitBurst)"'
            - '-ServiceNow__RateLimitQueueLimit "$(serviceNowRateLimitQueueLimit)"'
            - '-ServiceNow__CacheFreshMinutes "$(serviceNowCacheFreshMinutes)"'
            - '-ServiceNow__CacheMaximumStaleMinutes "$(serviceNowCacheMaximumStaleMinutes)"'

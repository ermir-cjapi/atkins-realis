trigger: none

resources:
  pipelines:
    - pipeline: build
      source: 'Agents - HR - Build'
      trigger:
        branches:
          - main
          - refs/tags/*

variables:
  isTagged: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/')]

# Runtime application settings are supplied by the environment variable groups below. Keep the
# ServiceNow rate and cache values aligned with the approved environment-specific operating limits.

stages:
  - stage: DEV
    variables:
      - group: 'Agents-HR-DEV'
    jobs:
      - template: templates/deploy-env.pipeline.yml
        parameters:
          azureSubscription: 'ACE-ALZ-AzureDevOps-ServiceConnection-Sub-5972ebe9-8383-47ce-aaac-d9b3e892850c'
          environment: 'dev'
          devOpsEnvironment: 'Agents - HR - DEV'
          searchEndpoint: '$(sharePointSearchEndpoint)'
          searchIndexName: '$(sharePointSearchIndexName)'
          searchSkillsetName: '$(sharePointSearchSkillsetName)'
          searchDataSourceName: '$(sharePointSearchDataSourceName)'
          searchIndexerName: '$(sharePointSearchIndexerName)'
          sharePointSiteUrl: '$(sharePointSiteUrl)'
          tenantId: '$(entraTenantId)'
          searchIngestionApplicationId: '$(searchIngestionApplicationId)'
          searchFederatedCredentialApplicationId: '$(searchFederatedCredentialApplicationId)'
          searchEmbeddingEndpoint: '$(searchEmbeddingEndpoint)'
          searchAiServicesEndpoint: '$(searchAiServicesEndpoint)'
          sharePointLibraryUrl: '$(sharePointLibraryUrl)'
          apiAdditionalAppSettings:
            - '-Foundry__Endpoint "$(foundryEndpoint)"'
            - '-Foundry__DeploymentName "$(foundryDeploymentName)"'
            - '-ServiceNow__Enabled "$(serviceNowEnabled)"'
            - '-ServiceNow__Endpoint "$(serviceNowEndpoint)"'
            - '-ServiceNow__TokenEndpoint "$(serviceNowTokenEndpoint)"'
            - '-ServiceNow__ClientId "$(serviceNowClientId)"'
            - '-EntraAuthentication__TenantId "$(entraTenantId)"'
            - '-EntraAuthentication__Audience "$(entraApiAudience)"'
            - '-EntraAuthentication__RequiredScope "$(entraRequiredScope)"'
            - '-SharePointSearch__Enabled "$(sharePointSearchEnabled)"'
            - '-SharePointSearch__Endpoint "$(sharePointSearchEndpoint)"'
            - '-SharePointSearch__IndexName "$(sharePointSearchIndexName)"'
            - '-SharePointSearch__SemanticConfigurationName "$(sharePointSearchSemanticConfigurationName)"'
            - '-SharePointSearch__CanonicalUrlBase "$(sharePointSearchCanonicalUrlBase)"'
            - '-SharePointSearch__VectorFieldName "$(sharePointSearchVectorFieldName)"'
            - '-SharePointSearch__MinimumRerankerScore "$(sharePointSearchMinimumRerankerScore)"'
            - '-OnBehalfOf__TenantId "$(entraTenantId)"'
            - '-OnBehalfOf__ClientId "$(entraApiClientId)"'
            - '-OnBehalfOf__UserTokenMode "OnBehalfOf"'
            - '-GraphProfile__Enabled "true"'
          # indexerAdditionalAppSettings:
          #   - ''

  - stage: UAT
    condition: and(succeeded(), eq(variables.isTagged, 'true'))
    variables:
      - group: 'Agents-HR-UAT'
    jobs:
      - template: templates/deploy-env.pipeline.yml
        parameters:
          azureSubscription: 'ACE-ALZ-AzureDevOps-ServiceConnection-Sub-59ad4235-3600-42ca-90ea-412f05b60b2e'
          environment: 'uat'
          devOpsEnvironment: 'Agents - HR - UAT'
          searchEndpoint: '$(sharePointSearchEndpoint)'
          searchIndexName: '$(sharePointSearchIndexName)'
          searchSkillsetName: '$(sharePointSearchSkillsetName)'
          searchDataSourceName: '$(sharePointSearchDataSourceName)'
          searchIndexerName: '$(sharePointSearchIndexerName)'
          sharePointSiteUrl: '$(sharePointSiteUrl)'
          tenantId: '$(entraTenantId)'
          searchIngestionApplicationId: '$(searchIngestionApplicationId)'
          searchFederatedCredentialApplicationId: '$(searchFederatedCredentialApplicationId)'
          searchEmbeddingEndpoint: '$(searchEmbeddingEndpoint)'
          searchAiServicesEndpoint: '$(searchAiServicesEndpoint)'
          sharePointLibraryUrl: '$(sharePointLibraryUrl)'
          apiAdditionalAppSettings:
            - '-Foundry__Endpoint "$(foundryEndpoint)"'
            - '-Foundry__DeploymentName "$(foundryDeploymentName)"'
            - '-ServiceNow__Enabled "$(serviceNowEnabled)"'
            - '-ServiceNow__Endpoint "$(serviceNowEndpoint)"'
            - '-ServiceNow__TokenEndpoint "$(serviceNowTokenEndpoint)"'
            - '-ServiceNow__ClientId "$(serviceNowClientId)"'
            - '-EntraAuthentication__TenantId "$(entraTenantId)"'
            - '-EntraAuthentication__Audience "$(entraApiAudience)"'
            - '-EntraAuthentication__RequiredScope "$(entraRequiredScope)"'
            - '-SharePointSearch__Enabled "$(sharePointSearchEnabled)"'
            - '-SharePointSearch__Endpoint "$(sharePointSearchEndpoint)"'
            - '-SharePointSearch__IndexName "$(sharePointSearchIndexName)"'
            - '-SharePointSearch__SemanticConfigurationName "$(sharePointSearchSemanticConfigurationName)"'
            - '-SharePointSearch__CanonicalUrlBase "$(sharePointSearchCanonicalUrlBase)"'
            - '-SharePointSearch__VectorFieldName "$(sharePointSearchVectorFieldName)"'
            - '-SharePointSearch__MinimumRerankerScore "$(sharePointSearchMinimumRerankerScore)"'
            - '-OnBehalfOf__TenantId "$(entraTenantId)"'
            - '-OnBehalfOf__ClientId "$(entraApiClientId)"'
            - '-OnBehalfOf__UserTokenMode "OnBehalfOf"'
            - '-GraphProfile__Enabled "true"'
          # indexerAdditionalAppSettings:
          #   - ''

  - stage: PROD
    condition: and(succeeded(), eq(variables.isTagged, 'true'))
    variables:
      - group: 'Agents-HR-PROD'
    jobs:
      - template: templates/deploy-env.pipeline.yml
        parameters:
          azureSubscription: 'ACE-ALZ-AzureDevOps-ServiceConnection-Sub-05ab2d21-b2b8-405a-bd0b-90a5c1530ea8'
          environment: 'prod'
          devOpsEnvironment: 'Agents - HR - PROD'
          searchEndpoint: '$(sharePointSearchEndpoint)'
          searchIndexName: '$(sharePointSearchIndexName)'
          searchSkillsetName: '$(sharePointSearchSkillsetName)'
          searchDataSourceName: '$(sharePointSearchDataSourceName)'
          searchIndexerName: '$(sharePointSearchIndexerName)'
          sharePointSiteUrl: '$(sharePointSiteUrl)'
          tenantId: '$(entraTenantId)'
          searchIngestionApplicationId: '$(searchIngestionApplicationId)'
          searchFederatedCredentialApplicationId: '$(searchFederatedCredentialApplicationId)'
          searchEmbeddingEndpoint: '$(searchEmbeddingEndpoint)'
          searchAiServicesEndpoint: '$(searchAiServicesEndpoint)'
          sharePointLibraryUrl: '$(sharePointLibraryUrl)'
          apiAdditionalAppSettings:
            - '-Foundry__Endpoint "$(foundryEndpoint)"'
            - '-Foundry__DeploymentName "$(foundryDeploymentName)"'
            - '-ServiceNow__Enabled "$(serviceNowEnabled)"'
            - '-ServiceNow__Endpoint "$(serviceNowEndpoint)"'
            - '-ServiceNow__TokenEndpoint "$(serviceNowTokenEndpoint)"'
            - '-ServiceNow__ClientId "$(serviceNowClientId)"'
            - '-EntraAuthentication__TenantId "$(entraTenantId)"'
            - '-EntraAuthentication__Audience "$(entraApiAudience)"'
            - '-EntraAuthentication__RequiredScope "$(entraRequiredScope)"'
            - '-SharePointSearch__Enabled "$(sharePointSearchEnabled)"'
            - '-SharePointSearch__Endpoint "$(sharePointSearchEndpoint)"'
            - '-SharePointSearch__IndexName "$(sharePointSearchIndexName)"'
            - '-SharePointSearch__SemanticConfigurationName "$(sharePointSearchSemanticConfigurationName)"'
            - '-SharePointSearch__CanonicalUrlBase "$(sharePointSearchCanonicalUrlBase)"'
            - '-SharePointSearch__VectorFieldName "$(sharePointSearchVectorFieldName)"'
            - '-SharePointSearch__MinimumRerankerScore "$(sharePointSearchMinimumRerankerScore)"'
            - '-OnBehalfOf__TenantId "$(entraTenantId)"'
            - '-OnBehalfOf__ClientId "$(entraApiClientId)"'
            - '-OnBehalfOf__UserTokenMode "OnBehalfOf"'
            - '-GraphProfile__Enabled "true"'
          # indexerAdditionalAppSettings:
          #   - ''

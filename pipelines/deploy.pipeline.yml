trigger: none

resources:
  pipelines:
    - pipeline: build
      source: 'Agents - HR - Build'
      trigger:
        branches:
          - main
          - refs/tags/*

variables:
  isTagged: $[startsWith(variables['Build.SourceBranch'], 'refs/tags/')]

# ServiceNow resilience/cache defaults are deployed from appsettings.json. Add environment-specific
# overrides here only after owner approval; the current 5 RPS and burst-5 values are provisional, not an SLA.

stages:
  - stage: DEV
    variables:
      - group: 'Agents-HR-DEV'
    jobs:
      - template: templates/deploy-env.pipeline.yml
        parameters:
          azureSubscription: 'ACE-ALZ-AzureDevOps-ServiceConnection-Sub-5972ebe9-8383-47ce-aaac-d9b3e892850c'
          environment: 'dev'
          devOpsEnvironment: 'Agents - HR - DEV'
          apiAdditionalAppSettings:
            - '-Foundry__Endpoint "$(foundryEndpoint)"'
            - '-Foundry__DeploymentName "$(foundryDeploymentName)"'
            - '-ServiceNow__Enabled "true"'
            - '-ServiceNow__Endpoint "$(serviceNowEndpoint)"'
            - '-ServiceNow__TokenEndpoint "$(serviceNowTokenEndpoint)"'
            - '-ServiceNow__ClientId "$(serviceNowClientId)"'
          # indexerAdditionalAppSettings:
          #   - ''

  - stage: UAT
    condition: and(succeeded(), eq(variables.isTagged, 'true'))
    variables:
      - group: 'Agents-HR-UAT'
    jobs:
      - template: templates/deploy-env.pipeline.yml
        parameters:
          azureSubscription: 'ACE-ALZ-AzureDevOps-ServiceConnection-Sub-59ad4235-3600-42ca-90ea-412f05b60b2e'
          environment: 'uat'
          devOpsEnvironment: 'Agents - HR - UAT'
          apiAdditionalAppSettings:
            - '-Foundry__Endpoint "$(foundryEndpoint)"'
            - '-Foundry__DeploymentName "$(foundryDeploymentName)"'
            - '-ServiceNow__Enabled "true"'
            - '-ServiceNow__Endpoint "$(serviceNowEndpoint)"'
            - '-ServiceNow__TokenEndpoint "$(serviceNowTokenEndpoint)"'
            - '-ServiceNow__ClientId "$(serviceNowClientId)"'
          # indexerAdditionalAppSettings:
          #   - ''

  - stage: PROD
    condition: and(succeeded(), eq(variables.isTagged, 'true'))
    variables:
      - group: 'Agents-HR-PROD'
    jobs:
      - template: templates/deploy-env.pipeline.yml
        parameters:
          azureSubscription: 'ACE-ALZ-AzureDevOps-ServiceConnection-Sub-05ab2d21-b2b8-405a-bd0b-90a5c1530ea8'
          environment: 'prod'
          devOpsEnvironment: 'Agents - HR - PROD'
          apiAdditionalAppSettings:
            - '-Foundry__Endpoint "$(foundryEndpoint)"'
            - '-Foundry__DeploymentName "$(foundryDeploymentName)"'
            - '-ServiceNow__Enabled "true"'
            - '-ServiceNow__Endpoint "$(serviceNowEndpoint)"'
            - '-ServiceNow__TokenEndpoint "$(serviceNowTokenEndpoint)"'
            - '-ServiceNow__ClientId "$(serviceNowClientId)"'
          # indexerAdditionalAppSettings:
          #   - ''
